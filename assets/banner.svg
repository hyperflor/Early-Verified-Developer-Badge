<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Early Verified Bot Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="0.55" stop-color="#eaf0ff"/>
      <stop offset="1" stop-color="#f1e8ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="250" cy="200" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b8cf3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5b8cf3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8cf3"/>
      <stop offset="1" stop-color="#3462d3"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#3462d3" flood-opacity="0.28"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#1b2350" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card">
      <rect width="1280" height="400" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#dots)"/>
    <circle cx="250" cy="200" r="250" fill="url(#glow)"/>
    <circle cx="1190" cy="-30" r="230" fill="#b79bff" fill-opacity="0.22"/>
    <circle cx="1060" cy="460" r="200" fill="#8fb1ff" fill-opacity="0.20"/>
  </g>
  <rect x="0.75" y="0.75" width="1278.5" height="398.5" rx="27.5" fill="none" stroke="#dbe2f5" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <polygon points="360,200 305,295.3 195,295.3 140,200 195,104.7 305,104.7"
             fill="url(#hex)" stroke="url(#hex)" stroke-width="20" stroke-linejoin="round"/>
  </g>
  <polygon points="345,200 297,283 203,283 155,200 203,117 297,117"
           fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" stroke-linejoin="round"/>
  <g fill="none" stroke="#111842" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="220,163 186,200 220,237"/>
    <polyline points="280,163 314,200 280,237"/>
    <line x1="263" y1="152" x2="237" y2="248"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="440" y="112" font-size="17" font-weight="700" letter-spacing="5" fill="#5b6394">DISCORD BADGE  ·  CLIENT-SIDE ONLY</text>
    <text x="436" y="190" font-size="66" font-weight="800" letter-spacing="1" fill="#0f1330">EARLY VERIFIED</text>
    <text x="436" y="260" font-size="66" font-weight="800" letter-spacing="1" fill="#0f1330">BOT DEVELOPER</text>
    <text x="440" y="306" font-size="22" font-weight="500" fill="#4e5370">Built the foundation  •  Very, very early</text>

    <rect x="440" y="328" width="122" height="30" rx="8" fill="#f59e3b" fill-opacity="0.16" stroke="#e07b16" stroke-width="1.5"/>
    <text x="501" y="349" font-size="15" font-weight="800" letter-spacing="1.5" text-anchor="middle" fill="#c2620e">★ MYTHIC</text>
  </g>
</svg>
